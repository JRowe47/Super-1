<text x="40" y="74" font-family="Arial,sans-serif" font-size="15" fill="#46546b" text-anchor="start" font-weight="normal">Historical report values | trained at 512 tokens | one seed | lower CE is better</text>
<text x="40" y="584" font-family="Arial,sans-serif" font-size="13" fill="#46546b" text-anchor="start" font-weight="normal">Small 1K/2K samples; absolute-position extrapolation confounds architecture.</text>
<text x="40" y="602" font-family="Arial,sans-serif" font-size="13" fill="#46546b" text-anchor="start" font-weight="normal">Report-backed, not raw checkpoint revalidation. CE is not accuracy; no SOTA claim.</text>
